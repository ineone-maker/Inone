name: Daily Rollup Stats

on:
  schedule:
    # Run at 2 AM UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  rollup:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Run Supabase Rollup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          # Read SQL rollup script
          ROLLUP_SQL=$(cat sql/02_rollup.sql)
          
          # Execute via Supabase API
          curl -X POST "https://api.supabase.com/v1/projects/$(echo $SUPABASE_URL | grep -o '[^/]*$')/query" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"$ROLLUP_SQL\"}"
      
      - name: Log Success
        run: echo "Daily rollup completed successfully"
