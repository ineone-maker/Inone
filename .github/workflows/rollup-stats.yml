name: Daily Analytics Rollup

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily

jobs:
  rollup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run rollup script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          
          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE
          );
          
          async function rollup() {
            // Refresh materialized views
            const { error: scoreError } = await supabase.rpc('refresh_feed_scores');
            const { error: videoError } = await supabase.rpc('refresh_video_scores');
            
            if (scoreError) throw scoreError;
            if (videoError) throw videoError;
            
            console.log('✓ Analytics rollup completed');
          }
          
          rollup().catch(err => {
            console.error('Rollup failed:', err);
            process.exit(1);
          });
          "
